[package]
name = "inertia_rs"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
homepage = "https://github.com/stuarth/inertia-rs"
repository = "https://github.com/stuarth/inertia-rs"
description = "Inertia.js server adapter for Rust (Axum and Rocket)"
keywords = ["inertia", "web", "framework", "rocket", "axum"]
categories = ["web-programming"]
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", optional = true }
bytes = { version = "1", optional = true }
fluent-uri = { version = "0.4.1", optional = true }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "alloc"] }
http-body-util = { version = "0.1.3", optional = true }
hyper = { version = "1.6", optional = true, features = ["client", "http1"] }
hyper-util = { version = "0.1.16", optional = true, features = ["client-legacy", "http1", "tokio"] }
rocket = { version = "0.5.1", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", optional = true, features = ["time", "sync"] }
tower = { version = "0.5.3", features = ["util"], optional = true }
tower-sessions = { version = "0.15", optional = true, default-features = false }
tracing = "0.1"

[features]
default = ["rocket"]
axum = ["dep:axum", "dep:fluent-uri", "dep:tower", "dep:tokio"]
rocket = ["dep:rocket", "dep:tokio"]
# Validation-error and flash storage for Axum backed by tower-sessions.
tower-sessions = ["axum", "dep:tower-sessions"]
# HTTP client for the official Inertia SSR server and Vite SSR dev endpoint.
ssr = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:tokio"]
# Unreleased Layers protocol from inertiajs/inertia#3236. The contract can
# change before upstream releases it.
experimental-layers = []

[dev-dependencies]
futures-executor = "0.3.31"
tower-sessions = { version = "0.15", features = ["memory-store", "axum-core"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync", "net", "io-util"] }

[package.metadata.docs.rs]
all-features = true
