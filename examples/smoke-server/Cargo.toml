[package]
name = "smoke-server"
version = "0.1.0"
edition = "2021"
workspace = "../"
publish = false

[dependencies]
axum = "0.8.9"
inertia_rs = { path = "../..", default-features = false, features = ["axum", "tower-sessions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tower-http = { version = "0.6.10", features = ["fs"] }
tower-sessions = { version = "0.15", features = ["memory-store"] }
